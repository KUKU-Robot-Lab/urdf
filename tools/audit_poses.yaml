# Task-home poses audited in addition to the all-zero pose.
#
# Zero-pose auditing has a blind spot: a pair can be clear at zero pose but
# come within cooking-inflation range only at a task home. Measured on the
# sensor asset: the left wrist home flex (l_aj_7=+1.3563) narrows
# l_al_5<->l_al_7 from 19mm to 3.2mm raw clearance, which convex
# decomposition cooking bridges into a ~5.4kN phantom contact
# (self-collision ON: L2 0.39mm -> 56mm, joint error 271 mrad).
#
# Register every task home hdgp derives here (asset stem -> pose name ->
# {joint: rad}; omitted joints stay at zero). generate_rl_urdf.py audits the
# zero pose plus all registered poses, FAILs on raw penetration at any of
# them, and unions the WARN pairs into the manifest's
# self_collision_filtered_pairs.
# 2026-09-05: the left-gripper homes were derived on the retired
# openarm_tesollo_sensor_rl (left arm + stock gripper); the same arm/gripper
# chain now lives in openarm_gripper_bi_rl (both arms), so they are re-keyed
# here. The right side is covered by the mirror symmetrization.
openarm_gripper_bi_rl:
  # hdgp gripper/left/grasp_sensor LEFT_ARM_HOME_JOINT_POS (probe-derived,
  # 0.5 rad joint-limit margin home)
  left_gripper_home:
    l_aj_1: -0.0136
    l_aj_2: -0.3757
    l_aj_3: -0.0010
    l_aj_4: 0.9336
    l_aj_5: -0.4655
    l_aj_6: 0.0003
    l_aj_7: -0.3306
  # Old Fabrics-IK grasp home (still used by the left lift task track).
  # The j7 flex alone drives the l_al_5<->l_al_7 approach (j5/j6 measured
  # irrelevant); only the joints that differ from zero meaningfully for the
  # arm silhouette are recorded.
  left_gripper_legacy_home:
    l_aj_3: 1.4065
    l_aj_6: -0.6695
    l_aj_7: 1.3563

# ★2026-09-15 RH56F1 all-convex-hull rebuild (user decision): self-collision ON must not create
# link-link contacts while the fingers move, so the audit covers hand poses that must be contact-free.
# NOT registered: thumb fully abducted+flexed WITH fingers fully closed - raw meshes of thumb vs
# index/middle collide 1~6mm there (real finger-thumb contact, the real hand stops on force), and a
# registered pose would turn that genuine contact into a collision filter.
