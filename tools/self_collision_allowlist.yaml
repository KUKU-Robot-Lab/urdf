# Known self-collision findings that are NOT asset defects.
#
# Hull-only pairs penetrate only under the convex-hull collision approximation
# (it fills concave pockets / rounds nested shells); raw meshes are clear or,
# for non-watertight vendor meshes, cannot be measured. Every WARN pair is
# exported to the manifest `self_collision_filtered_pairs` and authored as a
# PhysX collision filter by tools/build_usd.py, so self-collision can stay ON.
# ★2026-09-15: every asset incl. RH56F1 is built with convex hulls (vendor
#   default, generate_rl_urdf.DEFAULT_COLLIDER); the old
#   "requires convexDecomposition" premise no longer holds.
# Any pair NOT listed here fails the audit -> fix the asset, don't extend the
# list casually. Never allowlist a pair whose raw meshes genuinely collide in a
# reachable pose (e.g. RH56F1 thumb vs fingers with the hand fully closed) -
# that is real contact and must keep colliding.
pairs:
  - links: ["*_hl_palm", "*_hl_thumb_2"]
    reason: >-
      Convex hull fills the palm's thumb pocket; raw meshes have 2.8mm
      clearance at zero pose.
  - links: ["*_al_5", "*_al_7"]
    reason: >-
      Convex hulls round the forearm shells; raw meshes have 19mm clearance
      at zero pose.
  # --- RH56F1 -------------------------------------------------------------
  # The vendor collision meshes were unrepairably non-watertight, so the
  # generator replaces the finger-chain collisions with fitted primitives
  # (inscribed cylinders / AABB boxes; palm_1 cover collision dropped). That
  # made the geometry measurable, and the measurement shows the hand's nested
  # shell design GENUINELY overlaps at rest inside each finger (sensor/tip
  # pads wrap across the knuckle, thumb links nest, 0.7~9.4mm). These pairs
  # are accepted (`accept_raw`), which means: the RH56F1 asset must run with
  # `enabled_self_collisions=False`, or these pairs must be filtered at the
  # env level. Do NOT add accept_raw entries for the tesollo assets.
  - links: ["*_hl_index_1", "*_hl_index_[st]*"]
    accept_raw: true
    reason: RH56F1 sensor/tip pads wrap across the knuckle over segment 1 by design.
  - links: ["*_hl_middle_1", "*_hl_middle_[st]*"]
    accept_raw: true
    reason: RH56F1 sensor/tip pads wrap across the knuckle over segment 1 by design.
  - links: ["*_hl_ring_1", "*_hl_ring_[st]*"]
    accept_raw: true
    reason: RH56F1 sensor/tip pads wrap across the knuckle over segment 1 by design.
  - links: ["*_hl_pinky_1", "*_hl_pinky_[st]*"]
    accept_raw: true
    reason: RH56F1 sensor/tip pads wrap across the knuckle over segment 1 by design.
  - links: ["*_hl_*_sensor", "*_hl_*_tip"]
    accept_raw: true
    reason: RH56F1 sibling pads on the same distal segment abut each other by design.
  - links: ["*_hl_thumb_2", "*_hl_thumb_*"]
    accept_raw: true
    reason: RH56F1 thumb links nest inside each other by design.
  - links: ["*_hl_thumb_3", "*_hl_thumb_[st]*"]
    accept_raw: true
    reason: RH56F1 thumb pads wrap across the knuckle by design.
  # ★2026-09-15 force_filter: filtered in the built USD even when the exact-hull audit finds no penetration.
  #   After palm_2 became convexDecomposition (palm_sensor exposure), the thumb_2 sweep (0 -> 0.45 rad,
  #   self-collision ON, probe_rh56f1_finger_sweep.py --contacts) measured 52.8 N thumb_2 <-> palm_2 - the
  #   decomposition pieces reach the nested thumb root that the hull audit never flags.
  - links: ["*_hl_palm_2", "*_hl_thumb_2"]
    accept_raw: true
    force_filter: true
    reason: RH56F1 thumb root nests into the palm shell by design.
  - links: ["*_hl_palm_1", "*_hl_[imrp]*_1"]
    reason: >-
      RH56F1 palm_1 back cover wraps the four finger roots (hinged inside it);
      the right cover is watertight and measures raw -0.0~+0.1mm, the left
      cover mesh is non-watertight so the pair cannot be disproven (2026-09-15
      all-hull rebuild).
